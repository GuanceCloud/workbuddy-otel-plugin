name: ci

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: npm run check
      - run: npm ls --all
      - name: Shell installer smoke test
        if: runner.os != 'Windows'
        run: bash scripts/install.sh --config-dir "$RUNNER_TEMP/workbuddy-otel-test" --no-config
      - name: PowerShell installer smoke test
        if: runner.os == 'Windows'
        shell: powershell
        run: .\scripts\install.ps1 -ConfigDir (Join-Path $env:RUNNER_TEMP "workbuddy-otel-test") -NoConfig
